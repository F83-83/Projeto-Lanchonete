<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Painel da Cozinha</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f3f4f6;
        }

        header{
            background:#1f2937;
            color:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 8px rgba(0,0,0,.2);
        }

        header h1{
            font-size:28px;
        }

        #hora{
            font-size:20px;
            font-weight:bold;
        }

        .kanban{
            display:flex;
            gap:20px;
            padding:20px;
        }

        .coluna{
            flex:1;
            background:white;
            border-radius:15px;
            padding:15px;
            box-shadow:0 4px 10px rgba(0,0,0,.1);
            min-height:600px;
        }

        .coluna h2{
            text-align:center;
            margin-bottom:15px;
            color:#1f2937;
        }

        .pedido-card{
            background:white;
            border-left:6px solid #2563eb;
            border-radius:12px;
            padding:15px;
            margin-bottom:15px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
            transition:.2s;
        }

        .pedido-card:hover{
            transform:scale(1.02);
        }

        .recebido{
            border-left-color:#f59e0b;
        }

        .preparo{
            border-left-color:#2563eb;
        }

        .pronto{
            border-left-color:#10b981;
        }

        .pedido-card h3{
            margin-bottom:10px;
            color:#111827;
        }

        .pedido-card ul{
            padding-left:20px;
            margin-bottom:10px;
        }

        .pedido-card li{
            margin-bottom:5px;
        }

        .info{
            margin-top:10px;
            font-size:14px;
        }

        .status{
            font-weight:bold;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            color:white;
            font-weight:bold;
            transition:.2s;
        }

        button:hover{
            opacity:.9;
        }

        .btn-preparo{
            background:#2563eb;
        }

        .btn-pronto{
            background:#10b981;
        }

        .sem-pedidos{
            text-align:center;
            color:#6b7280;
            margin-top:20px;
        }

        @media(max-width:900px){

            .kanban{
                flex-direction:column;
            }

            .coluna{
                min-height:auto;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>👨‍🍳 Painel da Cozinha</h1>
    <span id="hora"></span>
</header>

<div class="kanban">

    <div class="coluna">
        <h2>🟡 Recebidos</h2>
        <div id="recebidos"></div>
    </div>

    <div class="coluna">
        <h2>🔵 Em Preparo</h2>
        <div id="preparo"></div>
    </div>

    <div class="coluna">
        <h2>🟢 Prontos</h2>
        <div id="prontos"></div>
    </div>

</div>

<script>

function atualizarHora(){

    const agora = new Date();

    document.getElementById("hora")
        .innerText =
        agora.toLocaleTimeString("pt-BR");
}

function carregarPedidos(){

    fetch("http://localhost:8080/api/pedidos")
        .then(res => res.json())
        .then(renderizarPedidos)
        .catch(err => console.error(err));
}

function renderizarPedidos(pedidos){

    const recebidos =
        document.getElementById("recebidos");

    const preparo =
        document.getElementById("preparo");

    const prontos =
        document.getElementById("prontos");

    recebidos.innerHTML = "";
    preparo.innerHTML = "";
    prontos.innerHTML = "";

    pedidos.forEach(pedido => {

        const card =
            document.createElement("div");

        card.classList.add("pedido-card");

        let itens = "";

        pedido.itens.forEach(item => {

            itens += `
                <li>
                    ${item.quantidade}x
                    ${item.produto.nome}
                </li>
            `;
        });

        let botao = "";

        if(pedido.status === "RECEBIDO"){

            card.classList.add("recebido");

            botao = `
                <button
                    class="btn-preparo"
                    onclick="
                        alterarStatus(
                            ${pedido.id},
                            'EM_PREPARO'
                        )
                    ">
                    Iniciar Preparo
                </button>
            `;
        }

        if(pedido.status === "EM_PREPARO"){

            card.classList.add("preparo");

            botao = `
                <button
                    class="btn-pronto"
                    onclick="
                        alterarStatus(
                            ${pedido.id},
                            'PRONTO'
                        )
                    ">
                    Marcar Pronto
                </button>
            `;
        }

        if(pedido.status === "PRONTO"){

            card.classList.add("pronto");
        }

        card.innerHTML = `
            <h3>Pedido #${pedido.id}</h3>

            <ul>
                ${itens}
            </ul>

            <div class="info">
                <p>
                    <span class="status">
                        Status:
                    </span>
                    ${pedido.status}
                </p>

                <p>
                    <strong>Total:</strong>
                    R$ ${pedido.total.toFixed(2)}
                </p>
            </div>

            ${botao}
        `;

        if(pedido.status === "RECEBIDO"){
            recebidos.appendChild(card);
        }

        if(pedido.status === "EM_PREPARO"){
            preparo.appendChild(card);
        }

        if(pedido.status === "PRONTO"){
            prontos.appendChild(card);
        }

    });

    if(recebidos.innerHTML === ""){
        recebidos.innerHTML =
            '<p class="sem-pedidos">Nenhum pedido recebido</p>';
    }

    if(preparo.innerHTML === ""){
        preparo.innerHTML =
            '<p class="sem-pedidos">Nenhum pedido em preparo</p>';
    }

    if(prontos.innerHTML === ""){
        prontos.innerHTML =
            '<p class="sem-pedidos">Nenhum pedido pronto</p>';
    }
}

function alterarStatus(id, status){

    fetch(
        `http://localhost:8080/api/pedidos/${id}/status?status=${status}`,
        {
            method:"PUT"
        }
    )
    .then(() => carregarPedidos())
    .catch(err => console.error(err));
}

atualizarHora();
setInterval(atualizarHora, 1000);

carregarPedidos();
setInterval(carregarPedidos, 5000);

</script>

</body>
</html>
